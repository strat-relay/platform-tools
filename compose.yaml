name: mt5-native-bridge

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trading_platform}
      POSTGRES_USER: ${POSTGRES_USER:-trading_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.postgres-tools
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-trading_platform}
      PGUSER: ${POSTGRES_USER:-trading_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "postgres.migrate"]

  postgres-tests:
    build:
      context: .
      dockerfile: Dockerfile.postgres-tools
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-trading_platform}
      PGUSER: ${POSTGRES_USER:-trading_app}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "unittest", "-v", "test_postgres_integration"]

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:14222:4222"
      - "127.0.0.1:18222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
    name: mt5_native_bridge_postgres_data
  nats_data:
    name: stratrelay_nats_data
