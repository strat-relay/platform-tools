# V2 personal execution runtime Deployment. `replicas: 0` by DEFAULT (mission section 15/10 hard
# requirement) - applying this manifest as-is starts zero pods and produces zero broker effect,
# regardless of EXECUTION_AUTHORITY_MODE. Scaling to replicas: 1 is a separate, explicit,
# operator-authorized action; it still does not enable execution by itself (see the env block
# below - EXECUTION_AUTHORITY_MODE is deliberately NOT set here either, so RuntimeConfig.from_env()
# defaults it to DISABLED, matching trade_management's own workload.yaml convention).
#
# Even with EXECUTION_AUTHORITY_MODE=ENABLED and replicas > 0, this container cannot place a real
# broker order today: V2_BRIDGE_FENCE_URL below is a deliberately unreachable placeholder, and
# RuntimeConfig.from_env() fails closed if it is ever unset entirely (execution_v2/runtime/
# config.py). execution_v2/runtime/service.py wires ONLY execution_v2.runtime.bridge_client.
# HttpBridgeFenceClient - a real HTTP client - never execution_v2.bridge_fence_sim.
# BridgeFenceSimulator (test-only; never imported by any production module, enforced by
# tests/test_execution_v2_isolation.py::test_no_production_module_imports_the_test_only_simulator).
# The real bridge-side fence/idempotency implementation this client would eventually reach
# (mt5_bridge_fence/) has never been deployed anywhere - see docs/v2_execution/README.md
# "Before activation" for what must happen first, and note the NetworkPolicy in this directory
# the bridge egress is declared separately and narrowly in network-policy.yaml; this workload
# still remains at replicas: 0 until separately authorized.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/component: v2-execution
    app.kubernetes.io/part-of: trading-platform
spec:
  replicas: 0  # DO NOT change without explicit operator authorization; see docs/v2_execution/README.md
  selector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: execution-v2-runtime
        app.kubernetes.io/component: v2-execution
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runtime
          image: localhost:5001/trading-platform-runtime@sha256:6aea18f32e2bc2ca5447165f41ffac8dd2a9ab4153bdf2f9a0a6e02ce04e5f81
          imagePullPolicy: IfNotPresent
          command: [python, -m, execution_v2.runtime]
          envFrom:
            - secretRef:
                name: trading-runtime-endpoints
            - secretRef:
                name: execution-v2-fence-signing-key   # V2_FENCE_SIGNING_KEY, V2_FENCE_KEY_ID - see README.md; not committed to Git
          env:
            # EXECUTION_AUTHORITY_MODE is deliberately NOT set here: RuntimeConfig.from_env()
            # defaults an unset value to DISABLED and fails closed on anything else
            # (execution_v2/runtime/config.py) - this env block never overrides it.
            - {name: V2_EXECUTION_ACCOUNT_ID, value: "REPLACE_BEFORE_ACTIVATION"}  # see README.md
            - {name: V2_EXECUTION_BRIDGE_MODE, value: "demo"}   # "demo" | "real" - the fence resource namespace, not a live switch
            - {name: V2_BRIDGE_FENCE_URL, value: "http://REPLACE_BEFORE_ACTIVATION:0/mcp"}  # real bridge endpoint; invalid until supplied
            - {name: V2_BROKER_SYMBOL_MAP_JSON, value: "REPLACE_BEFORE_ACTIVATION"}  # explicit canonical->broker map; missing/invalid fails closed
            - {name: V2_EXECUTION_HEALTH_PORT, value: "8082"}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8082
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: execution-v2-runtime
  namespace: trading
  labels:
    app.kubernetes.io/name: execution-v2-runtime
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: execution-v2-runtime
  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP
