# Narrow network access for the execution_v2 runtime and its one-off migration job.
# The namespace-wide default-deny-ingress policy remains in force for all other traffic.
#
# The future bridge egress is intentionally narrow: one host and the fenced execution MCP port.
# This manifest is a deployment plan only; it has not been applied to production.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-runtime-network
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.10.10/32
      ports:
        - {port: 8082, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-nats
      ports:
        - {port: 4222, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.166/32
      ports:
        - {port: 22348, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-migration-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-postgres-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-migrations
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-nats-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-runtime
      ports:
        - {port: 4222, protocol: TCP}
