# Narrow network access for the execution_v2 runtime and its one-off migration job.
# The namespace-wide default-deny-ingress policy remains in force for all other traffic.
#
# Deliberately UNLIKE trade_management's network policy: there is NO egress rule to
# 192.168.1.166 (the MT5 bridge host) at all, on any port, and no egress rule to any bridge fence
# endpoint either. execution_v2/runtime/service.py now wires a real HTTP client
# (execution_v2.runtime.bridge_client.HttpBridgeFenceClient) that WOULD need an egress rule once
# a real bridge fence service exists to reach it - that service does not exist yet (mt5_bridge_fence/
# has never been deployed anywhere; see docs/v2_execution/README.md "Before activation"), so no
# such rule is added here. Adding one is a future, separate, explicit change alongside deploying
# the bridge-side service itself - never bundled into scaling this Deployment up. Until then this
# pod has no network path to any bridge at all, so a code-level mistake could not reach one even
# if one were made (mission sections 6/14: DO NOT USE 22348, and 22347 is not read by this package).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-runtime-network
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.10.10/32
      ports:
        - {port: 8082, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-nats
      ports:
        - {port: 4222, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-migration-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: execution-v2-migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-postgres-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-migrations
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: execution-v2-nats-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: execution-v2-runtime
      ports:
        - {port: 4222, protocol: TCP}
