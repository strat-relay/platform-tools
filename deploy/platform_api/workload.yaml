apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-signals-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-signals-api
        app.kubernetes.io/part-of: trading-platform
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:5001/trading-platform-control-api@sha256:719d0dbc33af8f0fcdcabe4978e3e7787c04b422a0055b4537c9acb2de6e337a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 22350
              protocol: TCP
          env:
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
            - name: ORCHESTRATOR_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: ORCHESTRATOR_MODE
            - name: SIGNAL_AUTHORITY_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: SIGNAL_AUTHORITY_MODE
            - name: EXECUTION_AUTHORITY_MODE
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: EXECUTION_AUTHORITY_MODE
            - name: SIGNAL_DB_PRIMARY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: trading-db-primary-prepared
                  key: SIGNAL_DB_PRIMARY_ENABLED
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-signals-api
  ports:
    - name: http
      port: 22350
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: platform-control-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-control-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-signals-api
  ports:
    - name: http
      port: 22350
      targetPort: http
      protocol: TCP
