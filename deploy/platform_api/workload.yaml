apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-signals-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-signals-api
        app.kubernetes.io/part-of: trading-platform
        app.kubernetes.io/component: platform-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: localhost:5001/trading-platform-signals-api@sha256:34af3059c0b28a00d94b1b56e86eeb6292d60c50bd3b938a3d11fed11f153833
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 22350
              protocol: TCP
          env:
            - name: TRADING_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: trading-runtime-endpoints
                  key: TRADING_POSTGRES_DSN
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: platform-signals-api
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-signals-api
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-signals-api
  ports:
    - name: http
      port: 22350
      targetPort: http
      protocol: TCP
