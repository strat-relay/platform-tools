# Narrow network access for the P4 runtime and the one-off canonical migration job.
# The namespace-wide default-deny-ingress policy remains in force for all other traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trade-management-runtime-network
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trade-management-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.10.10/32
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-nats
      ports:
        - {port: 4222, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - ipBlock:
            cidr: 192.168.1.166/32
      ports:
        - {port: 22347, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trade-management-migration-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trade-management-migrations
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-postgres
      ports:
        - {port: 5432, protocol: TCP}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trade-management-postgres-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trade-management-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trade-management-migrations
      ports:
        - {port: 5432, protocol: TCP}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trade-management-nats-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trade-management-runtime
      ports:
        - {port: 4222, protocol: TCP}
