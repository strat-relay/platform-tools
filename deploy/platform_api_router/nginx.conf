worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/client_body_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    # CORS is centralized at the public API boundary so both the canonical
    # signals API and legacy Control API routes behave consistently. Never
    # reflect arbitrary origins: the Console is the sole credentialed client.
    map $http_origin $cors_allow_origin {
        default "";
        "https://console.stratrelay.app" $http_origin;
    }

    map $cors_allow_origin $cors_allow_credentials {
        default "";
        "https://console.stratrelay.app" "true";
    }

    server {
        listen 22351;
        server_name _;

        # Hide upstream CORS headers to avoid duplicate/conflicting values.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Max-Age;

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Allow-Credentials $cors_allow_credentials always;
        # POST is allowed at this boundary-wide preflight level (mission
        # CLAUDE-V2-RISK-EXECUTION-CONSOLE's one mutation endpoint,
        # /api/v1/v2-execution/risk-policy) - actual per-path method acceptance is still enforced
        # by platform_api's own route dispatch (PlatformControlApi.execute), which rejects POST
        # with 405 READ_ONLY_API for every other path, exactly as GET-only enforcement already
        # works today despite this same header being blanket rather than per-location.
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
        add_header Access-Control-Max-Age "600" always;
        add_header Vary "Origin" always;

        # Preflight is answered at the boundary; application routes remain
        # unchanged and continue to receive the browser's actual request.
        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header Connection "";

        location = /api/v1/signals {
            proxy_pass http://platform-signals-api:22350;
        }

        location ^~ /api/v1/signals/ {
            proxy_pass http://platform-signals-api:22350;
        }

        # Every non-signal API route is platform-owned after the canonical
        # Control API cutover. Unknown /api/v1 paths must not fall through to
        # the legacy filesystem-backed Control API.
        location ^~ /api/v1/ {
            proxy_pass http://platform-control-api:22350;
        }

        location = /api/v1 {
            proxy_pass http://platform-control-api:22350;
        }

        location / {
            proxy_pass http://control-api:22349;
        }
    }
}
