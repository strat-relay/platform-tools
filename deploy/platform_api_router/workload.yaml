apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api-router
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-api-router
    app.kubernetes.io/part-of: trading-platform
    app.kubernetes.io/component: api-router
spec:
  replicas: 1
  # The namespace is at its pod/CPU/memory quota. Replace in place rather
  # than requesting a surge replica; this can briefly interrupt API traffic.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api-router
        app.kubernetes.io/part-of: trading-platform
        app.kubernetes.io/component: api-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: router
          image: localhost:5001/trading-platform-api-router@sha256:d90610a197bee0f46217613013f9b1757d79cb1631c8fcc87adabfb220de6254
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 22351
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api-router
  namespace: trading
  labels:
    app.kubernetes.io/name: platform-api-router
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: platform-api-router
  ports:
    - name: http
      port: 22351
      targetPort: http
      protocol: TCP
