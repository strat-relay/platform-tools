apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared-egress
  namespace: trading
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/part-of: mt5-native-bridge
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 7844
        - protocol: UDP
          port: 7844
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: control-api
      ports:
        - protocol: TCP
          port: 22349
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchLabels:
              app.kubernetes.io/name: platform-api-router
      ports:
        - protocol: TCP
          port: 22351
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cattle-system
          podSelector:
            matchLabels:
              app: rancher
      ports:
        - protocol: TCP
          port: 80
