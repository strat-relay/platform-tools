      port: 4222
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: trading-nats
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-nats
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trading-nats
  ports:
    - name: client
      port: 4222
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trading-nats
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-nats
    app.kubernetes.io/part-of: trading-platform
spec:
  serviceName: trading-nats-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-nats
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          imagePullPolicy: IfNotPresent
          command: [sh, -c]
          args:
            - exec nats-server -js -sd /data/jetstream --user "$NATS_USER" --pass "$NATS_PASSWORD"
          env:
            - name: NATS_USER
              valueFrom:
                secretKeyRef:
                  name: trading-nats-auth
                  key: NATS_USER
            - name: NATS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-nats-auth
                  key: NATS_PASSWORD
          ports:
            - name: client
              containerPort: 4222
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
            failureThreshold: 20
          readinessProbe:
            tcpSocket:
              port: client
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trading-nats-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-db-primary-prepared
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-platform-config
    app.kubernetes.io/part-of: trading-platform
  annotations:
    trading-platform.stratrelay.io/activation: "manual-cutover-only"
data:
  SIGNAL_AUTHORITY_MODE: DB_PRIMARY
  SIGNAL_DB_PRIMARY_ENABLED: "true"
  SIGNAL_JETSTREAM_PRIMARY_ENABLED: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-data-ingress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [trading-postgres, trading-nats]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: main-runtime
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: signal-outbox-relay
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-platform-runtime-data-egress
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [main-runtime, outbox-relay]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trading
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [trading-postgres, trading-nats]
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
