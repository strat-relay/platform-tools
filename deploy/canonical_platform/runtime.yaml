apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-postgres-init
  namespace: trading
  labels:
    app.kubernetes.io/part-of: trading-platform
data:
  010-create-runtime-role.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --set=ON_ERROR_STOP=1 \
      --set=trading_app_password="$TRADING_APP_PASSWORD" <<'SQL'
    CREATE ROLE trading_app LOGIN PASSWORD :'trading_app_password';
    ALTER DATABASE trading_platform OWNER TO trading_app;
    GRANT CONNECT, TEMPORARY ON DATABASE trading_platform TO trading_app;
    SQL
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-postgres-data
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-postgres
    app.kubernetes.io/part-of: trading-platform
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: trading-postgres-headless
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-postgres
    app.kubernetes.io/part-of: trading-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: trading-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: trading-postgres
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-postgres
    app.kubernetes.io/part-of: trading-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trading-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trading-postgres
  namespace: trading
  labels:
    app.kubernetes.io/name: trading-postgres
    app.kubernetes.io/part-of: trading-platform
spec:
  serviceName: trading-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-postgres
        app.kubernetes.io/part-of: trading-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: trading_platform
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: trading-postgres-auth
                  key: POSTGRES_ADMIN_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-postgres-auth
                  key: POSTGRES_ADMIN_PASSWORD
            - name: TRADING_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: trading-postgres-auth
                  key: TRADING_APP_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
          startupProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/010-create-runtime-role.sh
              subPath: 010-create-runtime-role.sh
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trading-postgres-data
        - name: init-script
          configMap:
            name: trading-postgres-init
            defaultMode: 0555
---
apiVersion: v1
