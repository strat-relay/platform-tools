name: Release

# Production artifacts originate ONLY from commits reachable from origin/main
# (docs/engineering/PRODUCTION_RELEASE_POLICY.md). This workflow builds and
# publishes immutable, digest-addressed images to GHCR and records an update
# request for the GitOps repository. It never touches Kubernetes directly.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # manual rerun of a main release only - see the guard job below

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false # never cancel an in-flight production publish

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # Phase 7 guard: release jobs only run from refs/heads/main, and only for a SHA actually
  # reachable from origin/main - workflow_dispatch cannot target an arbitrary branch/SHA because
  # this job re-checks ancestry against origin/main regardless of how the run was triggered.
  guard:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse anything but refs/heads/main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "release.yml only runs from refs/heads/main, got ${{ github.ref }}" >&2
            exit 1
          fi

      - id: resolve
        name: Verify commit ancestry (scripts/verify_main_release.sh)
        run: |
          chmod +x scripts/verify_main_release.sh
          ./scripts/verify_main_release.sh "${{ github.sha }}"
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  test:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-postgres.txt
            requirements-messaging.txt
            requirements-realtime.txt

      - run: |
          pip install --no-cache-dir --disable-pip-version-check \
            -r requirements-postgres.txt \
            -r requirements-messaging.txt \
            -r requirements-realtime.txt

      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  # Phase 6 safety guard: fail the release outright if any tracked manifest in THIS repo
  # statically arms execution. Scoped to this repo's own deploy/ - the separate GitOps repository
  # is out of this workflow's authority (a different agent/repo owns that state).
  safety-guard:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Refuse a manifest that statically arms execution
        run: |
          set -eu
          # Only a literal scalar value counts - `valueFrom: configMapKeyRef` (the actual pattern
          # this repo's manifests use for EXECUTION_AUTHORITY_MODE) is an external, cluster-side
          # value this repo does not control and is correctly excluded.
          if grep -rEn '(EXECUTION_AUTHORITY_MODE|REAL_EXECUTION)\s*:\s*"?(ENABLED|true|1)"?\s*$' deploy/ 2>/dev/null; then
            echo "a manifest in deploy/ statically arms execution - refusing to release" >&2
            exit 1
          fi
          echo "no manifest in deploy/ statically arms execution"

  build-and-push:
    needs: [guard, test, safety-guard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trading-platform-control-api
            dockerfile: deploy/platform_api/Dockerfile
          - name: trading-platform-runtime
            dockerfile: Dockerfile.runtime
          - name: trading-platform-api-router
            dockerfile: deploy/platform_api_router/Dockerfile
          - name: trading-platform-realtime-api
            dockerfile: deploy/platform_realtime_api/Dockerfile
    outputs:
      control-api-digest: ${{ steps.collect.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (digest-addressed, never :latest as canonical reference)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.name }}:sha-${{ needs.guard.outputs.sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - id: collect
        name: Record image/digest
        # A unique filename per matrix leg - merge-multiple below places every artifact's files
        # into one shared directory, so two legs writing the same filename would silently
        # overwrite each other and lose an image's provenance record.
        run: |
          echo "${{ matrix.name }}=${{ steps.push.outputs.digest }}" > "${{ matrix.name }}.env"
          echo "digest=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.name }}
          path: ${{ matrix.name }}.env
          retention-days: 90

  release-manifest:
    needs: [guard, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
          merge-multiple: true

      - name: Build release manifest (Phase 5 provenance)
        run: |
          python3 scripts/build_release_manifest.py \
            --repository "${{ github.repository }}" \
            --commit "${{ needs.guard.outputs.sha }}" \
            --images-dir images \
            --registry "${{ env.REGISTRY }}/${{ env.OWNER }}" \
            --out release-manifest.json
          cat release-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json
          retention-days: 365

  gitops-update:
    needs: [guard, release-manifest]
    runs-on: ubuntu-latest
    # Never given cluster credentials, never calls kubectl. This job's only job is to record a
    # desired-state update in the (separately-owned) GitOps repository for Flux to reconcile.
    # See docs/engineering/PRODUCTION_RELEASE_POLICY.md for the expected repository/secret names.
    env:
      GITOPS_REPO: ${{ vars.GITOPS_REPOSITORY }} # e.g. "strat-relay/stratrelay-gitops"
      GITOPS_TOKEN: ${{ secrets.GITOPS_DEPLOY_TOKEN }} # fine-scoped token or GitHub App installation token
    steps:
      - name: Skip if the GitOps repository isn't configured yet
        if: env.GITOPS_REPO == '' || env.GITOPS_TOKEN == ''
        run: |
          echo "::notice::GITOPS_REPOSITORY (repo/org variable) and/or GITOPS_DEPLOY_TOKEN (secret) are not set - skipping the GitOps update. Images were still published to GHCR above; this step only records the desired-state request. See docs/engineering/PRODUCTION_RELEASE_POLICY.md."

      - uses: actions/checkout@v4
        if: env.GITOPS_REPO != '' && env.GITOPS_TOKEN != ''
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - uses: actions/download-artifact@v4
        if: env.GITOPS_REPO != '' && env.GITOPS_TOKEN != ''
        with:
          name: release-manifest

      - name: Open a GitOps update PR
        if: env.GITOPS_REPO != '' && env.GITOPS_TOKEN != ''
        run: |
          chmod +x scripts/open_gitops_update.sh
          ./scripts/open_gitops_update.sh release-manifest.json "$GITOPS_REPO" "trading-platform"
        env:
          GH_TOKEN: ${{ env.GITOPS_TOKEN }}
