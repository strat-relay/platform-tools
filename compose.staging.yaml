name: unified-outcome-staging

services:
  postgres:
    environment:
      POSTGRES_DB: outcome_staging
      POSTGRES_USER: outcome_staging
      POSTGRES_PASSWORD: outcome_staging_only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - outcome_staging_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - outcome_staging_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  outcome_staging_postgres:
  outcome_staging_redis:
